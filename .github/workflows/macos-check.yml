name: macos-check

on:
  push:
    branches: [main, m0-spike, m1-provider, m2-diarization, m3-live, m4-polish]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # NOTE: rust-cache intentionally omitted - Swatinem's partial target/
      # OUT_DIR restore breaks sherpa-onnx-sys native lib downloads between
      # the check and test steps (missing -L flag errors). Full builds are
      # slower but deterministic.

      # build.rs/tauri resource check requires the sidecar file to EXIST;
      # cargo check does not link it, so a placeholder suffices here
      # (real sidecar builds happen in release builds / on dev machines)
      - name: Placeholder llama-helper sidecar
        run: |
          mkdir -p frontend/src-tauri/binaries
          printf '#!/bin/sh\n' > frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
          chmod +x frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin

      - name: cargo check
        id: check
        run: |
          set -o pipefail
          cargo check --manifest-path frontend/src-tauri/Cargo.toml 2>&1 | tee ci-cargo-check.log

      - name: cargo test (qwen)
        if: steps.check.outcome == 'success'
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml qwen

      # publish full compiler output into the repo so the server-side agent
      # can read it via git pull (no Actions-log API credentials needed)
      - name: Publish check log as release asset on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -200 ci-cargo-check.log > ci-tail.txt || true
          cargo test --manifest-path frontend/src-tauri/Cargo.toml qwen 2>&1 | tail -100 >> ci-tail.txt || true
          TAG="ci-log-${GITHUB_RUN_ID}"
          gh release create "$TAG" ci-tail.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "ci log ${GITHUB_SHA::7}" \
            --notes "cargo check failure log" || \
          gh release upload "$TAG" ci-tail.txt --repo "$GITHUB_REPOSITORY" --clobber || true
