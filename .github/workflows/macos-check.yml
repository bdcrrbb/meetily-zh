name: macos-check

on:
  push:
    branches: [main, m0-spike, m1-provider, m2-diarization, m3-live, m4-polish]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # build.rs/tauri resource check requires the sidecar file to EXIST;
      # cargo check does not link it, so a placeholder suffices here
      # (real sidecar builds happen in release builds / on dev machines)
      - name: Placeholder llama-helper sidecar
        run: |
          mkdir -p frontend/src-tauri/binaries
          printf '#!/bin/sh\n' > frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
          chmod +x frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin

      - name: cargo check
        id: check
        run: |
          set -o pipefail
          cargo check --manifest-path frontend/src-tauri/Cargo.toml 2>&1 | tee ci-cargo-check.log

      - name: cargo test (qwen)
        if: steps.check.outcome == 'success'
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml qwen

      # publish full compiler output into the repo so the server-side agent
      # can read it via git pull (no Actions-log API credentials needed)
      - name: Publish check log on failure
        if: failure() && steps.check.outcome == 'failure'
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p ci
          cp ci-cargo-check.log ci/cargo-check.log
          git add ci/cargo-check.log
          git commit -m "ci: publish cargo check log (run ${GITHUB_RUN_ID})"
          git push origin HEAD:${GITHUB_REF_NAME}
