name: macos-check

on:
  push:
    branches: [main, m0-spike, m1-provider, m2-diarization, m3-live, m4-polish]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # build.rs/tauri resource check requires the sidecar file to EXIST;
      # cargo check does not link it, so a placeholder suffices here
      # (real sidecar builds happen in release builds / on dev machines)
      - name: Placeholder llama-helper sidecar
        run: |
          mkdir -p frontend/src-tauri/binaries
          printf '#!/bin/sh\n' > frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
          chmod +x frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin

      - name: cargo check
        run: cargo check --manifest-path frontend/src-tauri/Cargo.toml

      - name: cargo test (qwen)
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml qwen
