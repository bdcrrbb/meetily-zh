[package]
name = "m0-bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "m0"
path = "src/main.rs"

[dependencies]
sherpa-onnx = "1.13.7"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
strsim = "0.11"

[profile.release]
debug = false
